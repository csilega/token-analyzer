name: CI

on:
  push:                  # every push, any branch: lint + fast tests
  pull_request:
    branches: [main]     # PRs into main: everything

permissions:
  contents: read         # least privilege: CI only needs to read the code

env:
  PYTHON_VERSION: "3.12" # must match the Dockerfile's base image

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      - name: Install (exact runtime pins, then project + dev tools)
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]" -c requirements.lock
      - run: python -m ruff check .

  test-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      - name: Install (exact runtime pins, then project + dev tools)
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]" -c requirements.lock
      - name: Unit + stub tests (coverage gate enforced here)
        run: python -m pytest -m "not real_tokenizer" --cov

  test-slow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      REQUIRE_REAL_BACKEND: "1"   # a skip here would be a silent pass
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            pyproject.toml
      - name: Install (exact runtime pins, then project + dev tools)
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e ".[dev]" -c requirements.lock
      - name: Real-backend + property tests
        run: python -m pytest -m real_tokenizer

  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build the image
        run: docker build -t token-analyzer:ci .
      - name: Runs as non-root
        run: test "$(docker run --rm token-analyzer:ci whoami)" = "appuser"
      - name: Tokenizers are baked in (no network at all)
        run: >
          docker run --rm --network none token-analyzer:ci python -c
          "from token_analyzer.registry import SUPPORTED_MODELS, get_adapter;
          [get_adapter(m).encode('hi') for m in SUPPORTED_MODELS]"
      - name: Refuses to start without required config
        run: |
          if docker run --rm token-analyzer:ci python -c "import api.app.main"; then
            echo "App imported without CORS_ALLOW_ORIGINS -- fail-fast is broken"; exit 1
          fi
      - name: Boots and serves
        run: |
          docker run -d --name app -p 8000:8000 \
            -e CORS_ALLOW_ORIGINS=http://localhost:5173 token-analyzer:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health/live && break; sleep 1; done
          curl -fs http://localhost:8000/health/live
          curl -fs -X POST http://localhost:8000/analyze \
            -H 'Content-Type: application/json' \
            -d '{"text": "hello world", "model": "gpt-4"}'
      - name: Container logs (for debugging a failure)
        if: always()
        run: docker logs app || true

  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history, so we can diff against main
      - name: Did this PR change the lock?
        id: lock
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- requirements.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Lock unchanged -- new CVEs are handled by the weekly audit, not this PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.lock.outputs.changed == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Audit the lock
        if: steps.lock.outputs.changed == 'true'
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.lock