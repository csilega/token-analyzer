[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "token-analyzer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "tiktoken>=0.7.0",
    "tokenizers>=0.19.0",
    "prometheus_client>=0.20.0",
]

# test-only tools. Installed with: pip install -e ".[dev]"
# Kept out of runtime dependencies so the production image never ships them.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff"
]

[tool.ruff]
target-version = "py312"   # lint against the Python version we ship, not the one on your laptop
line-length = 100

[tool.ruff.lint]
select = [
  "F",  # Pyflakes: unused imports and variables, undefined names
  "E",  # pycodestyle errors
  "I",  # import sorting
  "B",  # flake8-bugbear: common bug patterns
]

[tool.setuptools.packages.find]
where = ["src"]

# lets a bare `pytest` find both suites, so CI doesn't need to spell out paths.
[tool.pytest.ini_options]
testpaths = ["tests", "api/tests"]
markers = [
  "real_tokenizer: needs the real cl100k_base vocabulary (fetched over the network on first load)",
]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src/token_analyzer", "api/app"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_also = [
    "@abstractmethod",   # excludes the whole decorated method: it can never execute
]